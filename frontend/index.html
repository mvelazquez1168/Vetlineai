<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2A4A" />
    <!-- iOS no soporta el manifest para "Agregar a inicio": sin estas tres
         líneas, Safari abre en modo Safari normal (con barra) en vez de
         standalone, aunque el manifest.webmanifest esté perfecto. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vetline Ai" />
    <title>Vetline Ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope, la tipografia del prompt 01c. `display=swap` para que
         el texto se vea con la fuente del sistema mientras carga en vez
         de quedar invisible, que es lo que pide el prompt. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
</head>
  <body class="bg-background text-text-primary font-sans">
    <div id="root"></div>
    <!-- Generado por el contenedor de nginx en cada arranque (ver
         frontend/docker-entrypoint.sh) a partir de las variables de
         entorno reales — window.__ENV__ tiene que existir ANTES de que
         cargue el bundle. En dev local (fuera de Docker) este archivo no
         existe y el navegador sigue de largo (404 silencioso); las libs
         que lo leen (ver runtimeEnv.ts) caen a import.meta.env. -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
