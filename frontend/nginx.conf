server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/manifest+json image/svg+xml;

    # El service worker define qué versión de la app corre offline — si el
    # navegador lo cachea, un usuario puede quedar atado a una versión
    # vieja indefinidamente, sin ninguna forma de enterarse. Nunca cachear.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Lo mismo para el registro del service worker en window.__ENV__ — se
    # regenera en cada arranque del contenedor (ver docker-entrypoint.sh) y
    # tiene que reflejar la configuración real de ESTE contenedor, no una
    # copia vieja servida desde la caché del navegador.
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html también sin caché larga: es el punto de entrada que
    # referencia a los assets con huella digital — si queda cacheado,
    # un despliegue nuevo no llega hasta que expire.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Los archivos bajo /assets/ llevan un hash de contenido en el nombre
    # (ver vite.config.ts — build por defecto de Vite): un cambio de
    # contenido siempre implica un nombre de archivo nuevo, así que cachear
    # "para siempre" es seguro — nunca hay una versión vieja sirviéndose
    # bajo un nombre que ahora significa otra cosa.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Resto de archivos estáticos (íconos, manifest, workbox-*.js) — caché
    # moderada, sin "immutable" porque no todos llevan hash en el nombre.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        # SPA: cualquier ruta que no matchee un archivo real cae a
        # index.html — el router del lado del cliente (react-router-dom)
        # resuelve la ruta real.
        try_files $uri /index.html;
    }
}
